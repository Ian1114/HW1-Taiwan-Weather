[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cwa-weather-dashboard"
version = "0.1.0"
description = "CWA Taiwan seven-day weather dashboard shared data core"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "folium==0.19.4",
  "pandas==2.2.3",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "truststore==0.10.4",
  "streamlit==1.41.1",
  "streamlit-folium==0.24.0",
  "uvicorn==0.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]
